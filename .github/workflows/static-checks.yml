# 정적 품질 게이트. main 병합/PR/수동 실행 시 pnpm check 를 돌린다.
#
# 이 저장소가 직접 소유하는 워크플로다. 예전에는 org 재사용 워크플로
# (seorilabs/.github 의 rn-static-checks.yml) 를 호출했는데, 이 저장소는
# public 이라 호출이 성립하지 않아 2026-08-05 이후 모든 실행이 잡 생성
# 전에 startup_failure 로 끝났다. 6주 동안 게이트가 없는 상태였다.
# 실행하는 명령(pnpm check)은 전부 이 저장소 안의 스크립트이므로,
# 외부 의존을 떼고 잡을 여기서 직접 정의한다.
#
# 스텝 구성은 같은 저장소의 pages.yml 과 맞춘다. 두 워크플로가 같은
# 방식으로 toolchain 을 세워야 한쪽만 조용히 어긋나는 일이 없다.
#
# public repo 이므로 ubuntu-latest 로 라우팅한다. private 전환 시에만
# self-hosted(ARC) 로 가도록 조건을 남겨 둔다. ARC self-hosted 는 public
# PR 경로에 노출하지 않는다.
name: Static Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: pnpm check
    runs-on: ${{ github.event.repository.private && 'seorilabs-x64' || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # platform-sdk lock 정합, product-core, 테스트팩 콘텐츠, preview,
      # SEO 페이지, release blocker 목록을 한 번에 본다. 개별 명령은
      # package.json 의 check:* 스크립트가 정본이다.
      - name: Run static checks
        run: pnpm check
